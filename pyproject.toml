[project]
name = "issue-tracker"
version = "0.1.0"
requires-python = ">=3.12,<4.0"
dependencies = ["fastapi-startkit[database,fastapi,inertia,sqlite,vite]==0.75.1"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
